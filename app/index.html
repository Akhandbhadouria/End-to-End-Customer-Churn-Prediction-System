<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Churn Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <div class="max-w-4xl mx-auto py-12 px-4">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-blue-900 mb-2">Bank Churn Predictor</h1>
            <p class="text-gray-600">Enter customer details to predict the likelihood of churn.</p>
        </header>

        <div class="bg-white rounded-2xl shadow-xl p-8">
            <form id="predictionForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Credit Score</label>
                    <input type="number" name="CreditScore" value="650" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Geography</label>
                    <select name="Geography" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="France">France</option>
                        <option value="Spain">Spain</option>
                        <option value="Germany">Germany</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Gender</label>
                    <select name="Gender" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Age</label>
                    <input type="number" name="Age" value="35" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>

                <!-- Tenure -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Tenure (Years)</label>
                    <input type="number" name="Tenure" value="5" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>

                <!-- Balance -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Balance</label>
                    <input type="number" step="0.01" name="Balance" value="0.00" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>

                <!-- NumOfProducts -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Number of Products</label>
                    <input type="number" name="NumOfProducts" value="1" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>

                <!-- HasCrCard -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Has Credit Card?</label>
                    <select name="HasCrCard" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="1">Yes</option>
                        <option value="0">No</option>
                    </select>
                </div>

                <!-- IsActiveMember -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Is Active Member?</label>
                    <select name="IsActiveMember" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="1">Yes</option>
                        <option value="0">No</option>
                    </select>
                </div>

                <!-- EstimatedSalary -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Estimated Salary</label>
                    <input type="number" step="0.01" name="EstimatedSalary" value="50000" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>

                <div class="md:col-span-2 mt-4">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200">
                        Predict Churn
                    </button>
                </div>
            </form>

            <div id="result" class="mt-8 hidden border-t pt-8 text-center">
                <div id="loader" class="hidden flex justify-center py-4">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                </div>
                <div id="resultContent" class="space-y-4">
                    <h3 class="text-3xl font-bold" id="statusHeader"></h3>
                    <div id="predictionBadge" class="inline-block px-4 py-1 rounded-full text-sm font-bold uppercase tracking-wider mb-2"></div>
                    <p class="text-lg text-gray-600">Probability of Leaving: <span id="probabilityValue" class="font-bold"></span></p>
                    <div class="w-full bg-gray-200 rounded-full h-4 overflow-hidden mt-2">
                        <div id="probabilityBar" class="h-full bg-blue-600 transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = {};
            formData.forEach((value, key) => {
                data[key] = isNaN(value) ? value : (value.includes('.') ? parseFloat(value) : parseInt(value));
            });

            const resultDiv = document.getElementById('result');
            const loader = document.getElementById('loader');
            const resultContent = document.getElementById('resultContent');
            const statusHeader = document.getElementById('statusHeader');
            const probabilityValue = document.getElementById('probabilityValue');
            const probabilityBar = document.getElementById('probabilityBar');

            resultDiv.classList.remove('hidden');
            resultContent.classList.add('hidden');
            loader.classList.remove('hidden');

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                loader.classList.add('hidden');
                resultContent.classList.remove('hidden');

                const prob = (result.churn_probability * 100).toFixed(2);
                probabilityValue.textContent = prob + '%';
                probabilityBar.style.width = prob + '%';

                const predictionBadge = document.getElementById('predictionBadge');

                if (result.prediction === 1) {
                    statusHeader.textContent = "CHURNED";
                    statusHeader.className = "text-4xl font-black text-red-600 tracking-tight";
                    predictionBadge.textContent = "High Risk Customer";
                    predictionBadge.className = "inline-block px-4 py-1 rounded-full text-sm font-bold uppercase tracking-wider mb-2 bg-red-100 text-red-700";
                    probabilityBar.className = "h-full bg-red-600 transition-all duration-500";
                } else {
                    statusHeader.textContent = "NOT CHURNED";
                    statusHeader.className = "text-4xl font-black text-green-600 tracking-tight";
                    predictionBadge.textContent = "Loyal Customer";
                    predictionBadge.className = "inline-block px-4 py-1 rounded-full text-sm font-bold uppercase tracking-wider mb-2 bg-green-100 text-green-700";
                    probabilityBar.className = "h-full bg-green-600 transition-all duration-500";
                }

            } catch (error) {
                console.error('Error:', error);
                alert('Prediction failed. Is the server running?');
                resultDiv.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
